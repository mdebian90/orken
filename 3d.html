<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ØRKEN - 3D MODELING</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Teko:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/section.css">
</head>
<body data-section-id="3d">

  <main class="viewport-scene">
    <div class="ambient-particles" id="ambientParticles" aria-hidden="true"></div>
    <div class="vignette-overlay" aria-hidden="true"></div>

    <div class="section-layout">
      <header class="section-topbar">
        <a href="index.html" class="topbar-logo-link">
          <img src="img/logo.png" class="topbar-logo-img">
        </a>

        <nav class="section-nav-controls">
          <button type="button" class="section-nav-btn" id="prevSectionBtn">
            <svg viewBox="0 0 36 32" aria-hidden="true">
              <polygon points="18,4 6,16 18,28 22,24 14,16 22,8" />
              <polygon points="30,4 18,16 30,28 34,24 26,16 34,8" />
            </svg>
            <span class="nav-btn-label" id="prevSectionLabel">BACK</span>
          </button>

          <button type="button" class="section-nav-btn" id="nextSectionBtn">
            <span class="nav-btn-label" id="nextSectionLabel">NEXT</span>
            <svg viewBox="0 0 36 32" aria-hidden="true">
              <polygon points="18,4 30,16 18,28 14,24 22,16 14,8" />
              <polygon points="6,4 18,16 6,28 2,24 10,16 2,8" />
            </svg>
          </button>
        </nav>
      </header>

      <section class="section-header-block">
        <div class="header-bracket-top">
          <h1 class="section-title" id="sectionTitle">3D MODELING</h1>
        </div>
        <div class="header-description-row">
          <div class="header-bracket-bottom">
            <p class="section-description" id="sectionDescription">
              Polygonal modeling, texturing, lighting, and rendering of 3D assets and environments developed in Blender and Autodesk Maya.
            </p>
          </div>
          <div class="header-hud-line" aria-hidden="true"></div>
        </div>
      </section>

      <section class="gallery-wrapper">
        <div class="gallery-grid" id="galleryGrid"></div>
        <p class="gallery-empty-msg" id="galleryEmptyMsg" hidden>
          No numbered images were found in the assigned folder.
        </p>
      </section>
    </div>
  </main>

  <div class="lightbox-overlay" id="lightboxOverlay" role="dialog" aria-modal="true" hidden>
    <button type="button" class="lightbox-close-btn" id="lightboxCloseBtn">✕</button>

    <button type="button" class="lightbox-step-btn lightbox-prev" id="lightboxPrevBtn">
      <svg viewBox="0 0 36 32" aria-hidden="true">
        <polygon points="18,4 6,16 18,28 22,24 14,16 22,8" />
        <polygon points="30,4 18,16 30,28 34,24 26,16 34,8" />
      </svg>
    </button>

    <div class="lightbox-stage" id="lightboxStage">
      <div class="lightbox-frame" id="lightboxFrame">
        <img id="lightboxImg" class="lightbox-img" src="">
      </div>
      <div class="lightbox-caption" id="lightboxCaption">01 / 01</div>
    </div>

    <button type="button" class="lightbox-step-btn lightbox-next" id="lightboxNextBtn">
      <svg viewBox="0 0 36 32" aria-hidden="true">
        <polygon points="18,4 30,16 18,28 14,24 22,16 14,8" />
        <polygon points="6,4 18,16 6,28 2,24 10,16 2,8" />
      </svg>
    </button>
  </div>

  <div class="page-transition-curtain" id="transitionCurtain">LOADING...</div>

  <script src="js/section.js"></script>
</body>
</html>
